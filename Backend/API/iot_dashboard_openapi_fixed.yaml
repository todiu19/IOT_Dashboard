    ActionHistoryResponse:
      type: object
      description: Một bản ghi lịch sử điều khiển.
      required:
      - id
      - deviceId
      - deviceName
      - userId
      - username
      - action
      - status
      - performedAt
      properties:
        id:
          type: integer
          description: ID bản ghi.
          format: int32
          example: 42
        deviceId:
          type: integer
          description: ID thiết bị.
          format: int32
          example: 1
        deviceName:
          type: string
          description: Tên thiết bị.
          example: LED 1
        userId:
          type: integer
          description: ID người điều khiển.
          format: int32
          example: 1
        username:
          type: string
          description: Tên người điều khiển.
          example: admin
        action:
          type: string
          description: Lệnh thực hiện.
          enum:
          - 'ON'
          - 'OFF'
          example: 'ON'
        status:
          type: string
          description: Trạng thái xử lý.
          enum:
          - LOADING
          - 'ON'
          - 'OFF'
          - FAILED
          example: 'ON'
        performedAt:
          type: string
          description: Thời điểm thao tác.
          format: date-time
          example: '2026-10-14T09:05:00+07:00'
      example:
        id: 42
        deviceId: 1
        deviceName: LED 1
        userId: 1
        username: admin
        action: 'ON'
        status: 'ON'
        performedAt: '2026-10-14T09:05:00+07:00'
    ProfileResponse:
      type: object
      description: Thông tin hồ sơ người dùng (các thuộc tính null không xuất hiện).
