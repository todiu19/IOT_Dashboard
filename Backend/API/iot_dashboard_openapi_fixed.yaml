          recordedAt: '2026-10-14T09:00:00+07:00'
        chartData:
        - id: 10
          sensorId: 1
          sensorName: Nhiệt độ (°C)
          value: 30.5
          recordedAt: '2026-10-14T09:00:00+07:00'
        devices:
        - id: 1
          name: LED 1
          status: 'ON'
        - id: 2
          name: LED 2
          status: 'OFF'
        pendingControls:
