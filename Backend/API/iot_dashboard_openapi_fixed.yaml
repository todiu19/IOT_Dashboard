  responses:
    BadRequest:
      description: Tham số hoặc dữ liệu không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            InvalidRequest:
              summary: Yêu cầu không hợp lệ
              value:
                code: 400
                errorCode: INVALID_REQUEST
                message: Tham số yêu cầu không hợp lệ.
            ValidationError:
              summary: Sai dữ liệu đầu vào
              value:
                code: 400
                errorCode: VALIDATION_ERROR
                message: Dữ liệu đầu vào không hợp lệ.
    Unauthorized:
      description: Chưa đăng nhập hoặc JWT không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 401
            errorCode: UNAUTHENTICATED
            message: Chưa đăng nhập.
    Forbidden:
      description: Người dùng không có quyền truy cập.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 403
            errorCode: ACCESS_DENIED
            message: Bạn không có quyền truy cập.
    NotFound:
      description: Không tìm thấy tài nguyên.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            Endpoint:
              summary: Endpoint không tồn tại
              value:
                code: 404
                errorCode: ENDPOINT_NOT_FOUND
                message: Không tìm thấy API.
            User:
              summary: Người dùng không tồn tại
              value:
                code: 404
                errorCode: USER_NOT_FOUND
                message: Không tìm thấy người dùng.
            Device:
              summary: Thiết bị không tồn tại
              value:
                code: 404
                errorCode: DEVICE_NOT_FOUND
                message: Không tìm thấy thiết bị.
            Sensor:
              summary: Cảm biến không tồn tại
              value:
                code: 404
                errorCode: SENSOR_NOT_FOUND
                message: Không tìm thấy cảm biến.
    Conflict:
      description: Thiết bị đang bận xử lý yêu cầu khác.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 409
            errorCode: DEVICE_BUSY
            message: Thiết bị đang xử lý lệnh khác.
    ServiceUnavailable:
      description: Không thể giao tiếp với MQTT Broker.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 503
            errorCode: MQTT_UNAVAILABLE
            message: MQTT Broker không khả dụng.
    InternalServerError:
      description: Lỗi không mong muốn tại Backend.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 500
            errorCode: INTERNAL_ERROR
            message: Đã xảy ra lỗi trong hệ thống.
    MethodNotAllowed:
      description: Phương thức HTTP không hỗ trợ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 405
            errorCode: METHOD_NOT_ALLOWED
            message: Phương thức HTTP không được hỗ trợ.
