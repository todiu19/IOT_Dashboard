          items:
            $ref: '#/components/schemas/ReadingResponse'
        chartData:
          type: array
          description: Dữ liệu dùng dựng biểu đồ.
          items:
            $ref: '#/components/schemas/ReadingResponse'
        devices:
          type: array
          description: Danh sách thiết bị.
          items:
            $ref: '#/components/schemas/DeviceResponse'
        pendingControls:
          type: array
